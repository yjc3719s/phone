<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;color:#1b1b1b;touch-action:manipulation}
.app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}
button{font-family:inherit;border:0;cursor:pointer}
/* keypad */
#num{height:18vh;min-height:90px;display:flex;align-items:center;justify-content:center;padding:0 12px;font-weight:500;white-space:nowrap;overflow:hidden;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#num.ph{color:#9aa0a6;font-size:28px}
.pad{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:1.2vh 4vw;padding:0 6vw}
.k{background:#eef1f4;border-radius:999px;font-size:clamp(30px,5.5vh,46px);color:#1b1b1b;display:flex;align-items:center;justify-content:center;min-height:0}
.k:active{background:#d5dae0}
.act{height:15vh;min-height:90px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;justify-items:center;padding:0 6vw}
.call{width:clamp(72px,10vh,96px);height:clamp(72px,10vh,96px);border-radius:50%;background:#1e8e3e;display:flex;align-items:center;justify-content:center;grid-column:2}
.call:active{background:#146c2e}
.back{grid-column:3;background:none;width:64px;height:64px;display:flex;align-items:center;justify-content:center}
svg.i{width:46%;height:46%;fill:#fff}
/* tabs */
.tabs{display:flex;border-top:2px solid #dfe3e8;background:#fff;padding-bottom:env(safe-area-inset-bottom,0)}
.tab{flex:1;height:10vh;min-height:64px;max-height:84px;background:#fff;font-size:clamp(18px,3vh,24px);font-weight:700;color:#5f6368;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab svg{width:28px;height:28px;fill:currentColor}
.tab.on{color:#1e8e3e;box-shadow:inset 0 -5px 0 #1e8e3e}
/* contacts */
.chead{padding:12px 14px}
.add{width:100%;height:64px;border-radius:16px;background:#1e8e3e;color:#fff;font-size:24px;font-weight:700}
.list{flex:1;overflow-y:auto;padding:0 14px 14px}
.row{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.nm{flex:1;min-width:0;text-align:left;background:#eef1f4;border-radius:16px;padding:0 18px;height:72px;font-size:30px;font-weight:700;color:#1b1b1b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm:active{background:#d5dae0}
.sm{width:76px;border-radius:16px;font-size:20px;font-weight:700}
.ed{background:#e3eefc;color:#0b57d0}
.dl{background:#fde7e7;color:#b3261e}
.empty{text-align:center;color:#5f6368;font-size:22px;padding:30px 10px}
/* call screens */
.scr{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;color:#fff;padding:calc(env(safe-area-inset-top,0) + 2vh) 14px calc(env(safe-area-inset-bottom,0) + 2vh);background:#202124}
.scr.on{display:flex}
#scrE{background:linear-gradient(180deg,#1b3fa8 0%,#1c47b8 55%,#3472c2 100%)}
.av{width:clamp(80px,13vh,130px);height:clamp(80px,13vh,130px);border-radius:50%;background:#4e84ee;flex:none;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.av svg{width:80%;height:80%}
.who{font-size:clamp(26px,4.2vh,40px);font-weight:700;margin:1.2vh 0 0;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:clamp(22px,3.4vh,32px);margin:1vh 0;color:#cfd3d8;text-align:center}
.sp{flex:1}
.end{width:clamp(76px,11vh,100px);height:clamp(76px,11vh,100px);border-radius:50%;background:#d93025;display:flex;align-items:center;justify-content:center;flex:none}
.end:active{background:#a52019}
.end svg{transform:rotate(135deg)}
.msg{font-weight:900;text-align:center;line-height:1.35;font-size:min(8.4vw,4.4vh);margin:1.4vh 0;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.msg .g{display:block;height:.8em}
.msg b{color:#f6ee3b}
.photo{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;margin:1vh 0}
.photo img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff}
/* modal */
.md{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
.md.on{display:flex}
.box{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:420px}
.box h2{margin:0 0 14px;font-size:26px}
.box input{width:100%;height:64px;font-size:28px;border:3px solid #9aa0a6;border-radius:14px;padding:0 14px;user-select:text;-webkit-user-select:text}
.box p{font-size:24px;margin:0 0 6px}
.bb{display:flex;gap:10px;margin-top:16px}
.bb button{flex:1;height:64px;border-radius:14px;font-size:24px;font-weight:700}
.b1{background:#eef1f4;color:#1b1b1b}.b2{background:#1e8e3e;color:#fff}.b2.d{background:#d93025}
</style>
</head>
<body>
<div class="app">
  <div id="vKey" class="view on">
    <div id="num" class="ph">番号を入力</div>
    <div class="pad" id="pad"></div>
    <div class="act">
      <button class="call" id="callBtn" aria-label="発信"><svg class="i" viewBox="0 0 24 24"><use href="#ph"/></svg></button>

    </div>

    <button class="tab" id="tCon"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>連絡先</button>
  </div>
</div>

<!-- 発信中 / 留守電 -->
<div class="scr" id="scrC">
  <div class="sp" style="flex:.3"></div>
  <div class="av"><svg viewBox="0 0 24 24" fill="#c6dafc"><circle cx="12" cy="9" r="4"/><ellipse cx="12" cy="20" rx="8" ry="5"/></svg></div>
  <div class="who" id="cWho"></div>
  <div class="st" id="cSt">発信中…</div>
  <div class="sp"></div>
  <button class="end" id="endC" aria-label="切断"><svg class="i" viewBox="0 0 24 24" style="width:46%;height:46%"><use href="#ph"/></svg></button>
</div>

<svg width="0" height="0" style="position:absolute"><defs><path id="ph" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></defs></svg>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
/* ---------- 音 ---------- */
var AC=null,master=null;
function ctx(){
  if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();master=AC.createGain();master.gain.value=.8;master.connect(AC.destination)}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function primeSpeech(){try{var u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
var F={'1':[697,1209],'2':[697,1336],'3':[697,1477],'4':[770,1209],'5':[770,1336],'6':[770,1477],'7':[852,1209],'8':[852,1336],'9':[852,1477],'*':[941,1209],'0':[941,1336],'#':[941,1477]};
function dtmf(k){
  var a=ctx();if(!a)return;var t=a.currentTime,g=a.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.01);g.gain.setValueAtTime(.35,t+.13);g.gain.linearRampToValueAtTime(0,t+.15);
  g.connect(master);
  F[k].forEach(function(f){var o=a.createOscillator();o.frequency.value=f;o.connect(g);o.start(t);o.stop(t+.16)});
}
var ringNodes=[];
function ring(sec,cycle){ /* 低め400Hz・16Hz変調、1秒鳴って2秒休む */
  var a=ctx();if(!a)return;var t=a.currentTime;
  var o=a.createOscillator();o.frequency.value=400;
  var am=a.createGain();am.gain.value=.5;
  var l=a.createOscillator();l.frequency.value=16;var lg=a.createGain();lg.gain.value=.5;l.connect(lg);lg.connect(am.gain);
  var env=a.createGain();env.gain.value=0;
  for(var s=0;s<sec;s+=cycle){env.gain.setValueAtTime(0,t+s);env.gain.linearRampToValueAtTime(.5,t+s+.03);env.gain.setValueAtTime(.5,t+s+1);env.gain.linearRampToValueAtTime(0,t+s+1.03)}
  o.connect(am);am.connect(env);env.connect(master);
  o.start(t);l.start(t);o.stop(t+sec);l.stop(t+sec);ringNodes=[o,l,env];
}
function stopRing(){ringNodes.forEach(function(n){try{n.stop&&n.stop()}catch(e){}try{n.disconnect()}catch(e){}});ringNodes=[]}
function beep(){var a=ctx();if(!a)return;var t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.frequency.value=1000;g.gain.setValueAtTime(.3,t);g.gain.setValueAtTime(.3,t+.9);g.gain.linearRampToValueAtTime(0,t+1);o.connect(g);g.connect(master);o.start(t);o.stop(t+1.02)}
function say(text,done){
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.pitch=.7;u.rate=.8;u.volume=1;
    var vs=speechSynthesis.getVoices().filter(function(v){return /^ja/i.test(v.lang)});if(vs.length)u.voice=vs[0];
    var fin=false;function f(){if(!fin){fin=true;done&&done()}}
    u.onend=f;u.onerror=f;
    speechSynthesis.speak(u);
    return setTimeout(f,Math.max(8000,text.length*450));
  }catch(e){done&&done()}
}
/* ---------- キーパッド ---------- */
var keys=['1','2','3','4','5','6','7','8','9','*','0','#'],num='';
keys.forEach(function(k){var b=document.createElement('button');b.className='k';b.textContent=k;b.onclick=function(){press(k)};$('pad').appendChild(b)});
function fit(){
  var n=$('num');
  if(!num){n.className='ph';n.textContent='番号を入力';n.style.fontSize='';return}
  n.className='';n.textContent=num;
  var w=n.clientWidth-24,len=Math.max(num.length,6);
  n.style.fontSize=Math.max(14,Math.min(64,w/(len*.64)))+'px';
}
function press(k){ctx();dtmf(k);if(num.length<15){num+=k;fit()}}
$('bk').onclick=function(){num=num.slice(0,-1);fit()};
window.addEventListener('resize',fit);
var EMG=['110','119','118'];
$('callBtn').onclick=function(){
  ctx();primeSpeech();
  if(!num)return;
  if(EMG.indexOf(num)>-1)emergency(num);else startCall(num);
};
/* ---------- 通話 ---------- */
var timers=[],active=false;
function T(f,ms){var id=setTimeout(f,ms);timers.push(id);return id}
function clearAll(){timers.forEach(clearTimeout);timers=[];stopRing();try{speechSynthesis.cancel()}catch(e){}}
function show(id){['scrC','scrE'].forEach(function(s){$(s).classList.toggle('on',s===id)})}
function startCall(label){
  clearAll();active=true;
  $('cWho').textContent=label;$('cSt').textContent='発信中…';show('scrC');
  ring(9,3);
  T(voicemail,9000);
}
function voicemail(){
  stopRing();$('cSt').textContent='留守番電話';
  var tid=say('ただいま電話に出ることができません。ピーっという発信音のあとに、ご用件をお話しください。',function(){
    clearTimeout(tid);if(!active)return;
    beep();
    T(function(){var s=0;$('cSt').textContent='録音中 0:00';
      (function tick(){if(!active)return;s++;$('cSt').textContent='録音中 '+Math.floor(s/60)+':'+('0'+s%60).slice(-2);T(tick,1000)})()},1000);
  });
  timers.push(tid);
}
function emergency(n){
  clearAll();active=true;
  $('cWho').textContent=n;$('cSt').textContent='発信中…';show('scrC');
  ring(3,3); /* 発信音(1コール) → 案内画面 */
  T(function(){
    stopRing();$('eWho').textContent=n;show('scrE');
    say('ただいま電話が混み合っております。　部屋の呼び出しボタンを押して、ご用件をスタッフに伝えてください。すぐに係の者が対応いたします。また、呼び出しボタンの場所や使い方は携帯画面を参考にしてください');
  },3000);
}
function hang(){clearAll();active=false;show(null);num='';fit()}
$('endC').onclick=hang;$('endE').onclick=hang;
/* ---------- タブ ---------- */
function tab(c){$('vKey').classList.toggle('on',!c);$('vCon').classList.toggle('on',c);$('tKey').classList.toggle('on',!c);$('tCon').classList.toggle('on',c);if(!c)fit()}
$('tKey').onclick=function(){tab(false)};$('tCon').onclick=function(){tab(true);render()};
/* ---------- 連絡先 ---------- */
var KEY='phoneSimContacts',cs;
try{cs=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(cs))cs=['息子','娘','孫','友達'];
function save(){try{localStorage.setItem(KEY,JSON.stringify(cs))}catch(e){}}
function render(){
  var L=$('list');L.innerHTML='';
  if(!cs.length){L.innerHTML='<div class="empty">連絡先がありません。<br>上のボタンで追加してください。</div>';return}
  cs.forEach(function(n,i){
    var r=document.createElement('div');r.className='row';
    var a=document.createElement('button');a.className='nm';a.textContent=n;a.onclick=function(){ctx();primeSpeech();startCall(n)};
    var e=document.createElement('button');e.className='sm ed';e.textContent='編集';e.onclick=function(){nameDlg('名前を編集',n,function(v){cs[i]=v;save();render()})};
    var d=document.createElement('button');d.className='sm dl';d.textContent='削除';d.onclick=function(){confirmDlg(n,function(){cs.splice(i,1);save();render()})};
    r.appendChild(a);r.appendChild(e);r.appendChild(d);L.appendChild(r);
  });
}
$('addBtn').onclick=function(){nameDlg('連絡先を追加','',function(v){cs.push(v);save();render()})};
var onYes=null;
function open(t){$('mT').textContent=t;$('md').classList.add('on')}
function nameDlg(t,val,cb){
  $('mB').innerHTML='<input id="mI" maxlength="20" placeholder="名前" autocomplete="off">';
  var i=$('mI');i.value=val;$('mYes').className='b2';$('mYes').textContent='保存';
  onYes=function(){var v=i.value.trim();if(!v){i.focus();return false}cb(v);return true};
  open(t);setTimeout(function(){i.focus()},50);
}
function confirmDlg(n,cb){
  $('mB').innerHTML='<p>「'+n.replace(/[&<>]/g,'')+'」を削除しますか？</p>';
  $('mYes').className='b2 d';$('mYes').textContent='削除';
  onYes=function(){cb();return true};open('削除の確認');
}
$('mNo').onclick=function(){$('md').classList.remove('on')};
$('mYes').onclick=function(){if(onYes&&onYes())$('md').classList.remove('on')};
render();fit();
})();
</script>
</body>
</html>
